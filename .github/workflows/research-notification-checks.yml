name: Research notification checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/first-body-paragraph.test.mjs scripts/research-notifications.test.mjs scripts/brevo-research-test.test.mjs scripts/brevo-research-live.test.mjs
