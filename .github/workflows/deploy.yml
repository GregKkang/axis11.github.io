name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The deploy step pushes the built site to the gh-pages branch, so the workflow
# needs write access to the repository rather than the Pages artifact service.
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Include the application error page
        run: cp dist/index.html dist/404.html

      # The site is published into the gh-pages branch rather than uploaded as a
      # replace-everything Pages artifact. `keep_files` leaves anything already on
      # that branch in place, so pages published outside this build — Market Pulse
      # under /market-pulse/ — survive every site deploy.
      - name: Publish the site to the gh-pages branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy the site from ${{ github.sha }}"
