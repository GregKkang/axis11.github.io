name: Build and deploy website

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Market Pulse content ready]
    types: [completed]
    branches: [gh-pages]

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Package notification preview inputs
        run: |
          mkdir -p .notification-inputs
          cp src/data/articles.json scripts/research-notifications.mjs .github/research-notifications.json .notification-inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: research-notification-inputs
          path: .notification-inputs/
          include-hidden-files: true
          retention-days: 7
      - name: Include the application error page
        run: cp dist/index.html dist/404.html
      - name: Check out published Market Pulse
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .market-pulse-overlay
          sparse-checkout: market-pulse
          persist-credentials: false
      - name: Overlay Market Pulse without changing other pages
        run: |
          test -f .market-pulse-overlay/market-pulse/index.html
          mkdir -p dist/market-pulse
          cp -a .market-pulse-overlay/market-pulse/. dist/market-pulse/
          cmp .market-pulse-overlay/market-pulse/index.html dist/market-pulse/index.html
      - name: Apply Market Pulse site layout
        run: node scripts/style-market-pulse-overlay.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  notification-preview:
    name: Research notification preview (no sending)
    needs: [build, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: research-notification-inputs
          path: notification-inputs
      - name: Preview notifications for the deployed content
        env:
          DEPLOYED_SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node notification-inputs/research-notifications.mjs notification-inputs/articles.json notification-inputs/research-notifications.json "$DEPLOYED_SITE_URL" notification-preview
      - uses: actions/upload-artifact@v4
        with:
          name: research-notification-preview
          path: notification-preview/
          retention-days: 14
